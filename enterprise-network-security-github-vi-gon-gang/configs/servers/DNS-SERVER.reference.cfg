! CẤU HÌNH MẪU. Dịch vụ DNS Cisco IOS chỉ dành cho lab.
hostname DNS-SERVER
no ip routing
interface Ethernet0/0
 description TO-SW6
 ip address 10.30.0.11 255.255.255.248
 no shutdown
ip default-gateway 10.30.0.9
ip domain lookup
ip dns server
