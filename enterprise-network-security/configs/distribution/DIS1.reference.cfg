hostname DIS1
ip routing
service dhcp
spanning-tree mode rapid-pvst
vlan 10
 name IT
vlan 20
 name SALE
vlan 30
 name MKT
vlan 40
 name USER
interface Ethernet0/0
 description L3-TO-CORE
 no switchport
 ip address 10.0.0.6 255.255.255.252
 no shutdown
interface range Ethernet0/1 - 2
 description BUNDLE-TO-DIS2
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 channel-group 1 mode on
 no shutdown
interface Port-channel1
 description TRUNK-TO-DIS2
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
interface Ethernet0/3
 description TO-SW1
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
interface Ethernet1/0
 description TO-SW2
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 20
 no shutdown
interface Ethernet1/1
 description TO-SW3
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 30
 no shutdown
interface Ethernet1/2
 description TO-SW4
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 40
 no shutdown
interface Vlan10
 ip address 10.10.10.2 255.255.255.0
 ip helper-address 10.10.50.10
 standby 10 ip 10.10.10.1
 standby 10 priority 120
 standby 10 preempt
 no shutdown
interface Vlan20
 ip address 10.10.20.2 255.255.255.0
 ip helper-address 10.10.50.10
 standby 20 ip 10.10.20.1
 standby 20 priority 100
 standby 20 preempt
 no shutdown
interface Vlan30
 ip address 10.10.30.2 255.255.255.0
 ip helper-address 10.10.50.10
 standby 30 ip 10.10.30.1
 standby 30 priority 120
 standby 30 preempt
 no shutdown
interface Vlan40
 ip address 10.10.40.2 255.255.255.0
 ip helper-address 10.10.50.10
 standby 40 ip 10.10.40.1
 standby 40 priority 100
 standby 40 preempt
 no shutdown
spanning-tree vlan 10,30 root primary
spanning-tree vlan 20,40 root secondary
router ospf 1
 router-id 2.2.2.2
 passive-interface default
 no passive-interface Ethernet0/0
 network 10.0.0.4 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
