! CẤU HÌNH MẪU. HTTP Cisco IOS là GIAO DIỆN QUẢN TRỊ; chỉ dùng trên WAN mô phỏng cô lập.
hostname WEB-SERVER
no ip routing
interface Ethernet0/0
 description TO-SW6
 ip address 10.30.0.10 255.255.255.248
 no shutdown
ip default-gateway 10.30.0.9
username labweb privilege 15 secret <LAB_PASSWORD>
ip http authentication local
ip http server
