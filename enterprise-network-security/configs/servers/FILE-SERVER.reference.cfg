! CẤU HÌNH MẪU. TFTP Cisco IOS, không phải máy chủ SMB doanh nghiệp.
hostname FILE-SERVER
no ip routing
interface Ethernet0/0
 description TO-SW5
 ip address 10.10.50.11 255.255.255.0
 no shutdown
ip default-gateway 10.10.50.1
! Chỉ chia sẻ file KHÔNG NHẠY CẢM đã có sẵn trong unix:.
! File nguồn từng kiểm thử unix:tftp-test.cfg (1212 byte) được sao từ running-config.
access-list 10 permit 10.10.0.0 0.0.255.255
tftp-server unix:tftp-test.cfg 10
! KHÔNG đăng nội dung running-config thật lên GitHub.
